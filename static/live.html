<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進行中 · Token 戰情室</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon-v2.ico">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=37">
  <link rel="stylesheet" href="/static/live.css?v=9">
</head>
<body>
  <main class="live-main">
    <header class="live-header">
      <a class="live-back" href="/">← Token 戰情室</a>
      <h1>進行中</h1>
      <span id="live-notice" class="live-status live-notice" role="alert"></span>
      <span id="live-status" class="live-status" role="status"></span>
    </header>
    <section aria-label="進行中的 session">
      <div id="live-cards" class="live-cards"></div>
      <p id="live-empty" class="live-empty" hidden>目前沒有進行中的 session</p>
    </section>
    <section aria-label="最近結束">
      <h2 class="live-section-title">最近結束</h2>
      <div id="recent-list" class="live-cards"></div>
      <p id="recent-empty" class="live-empty live-empty-small" hidden>24 小時內沒有結束的 session</p>
    </section>
  </main>
  <script src="/static/live.js?v=8"></script>
</body>
</html>
