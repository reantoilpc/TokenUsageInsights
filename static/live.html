<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進行中 · Token 戰情室</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon-v2.ico">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=37">
  <link rel="stylesheet" href="/static/live.css?v=13">
</head>
<body>
  <main class="live-main">
    <header class="live-header">
      <a class="live-back" href="/">← Token 戰情室</a>
      <h1>進行中</h1>
      <span id="live-notice" class="live-status live-notice" role="alert"></span>
      <span id="live-status" class="live-status" role="status"></span>
    </header>
    <section aria-label="進行中的 session">
      <div id="live-cards" class="live-cards"></div>
      <p id="live-empty" class="live-empty" hidden>目前沒有進行中的 session</p>
    </section>
    <section aria-label="最近結束">
      <h2 class="live-section-title">最近結束</h2>
      <div id="recent-list" class="live-cards"></div>
      <p id="recent-empty" class="live-empty live-empty-small" hidden>24 小時內沒有結束的 session</p>
    </section>
  </main>
  <dialog id="rename-dialog" class="live-dialog" aria-labelledby="rename-title">
    <form id="rename-form" method="dialog">
      <h2 id="rename-title" class="live-dialog-title">改名</h2>
      <p class="live-dialog-hint">按「複製並前往分頁」後，到分頁按 Ctrl+V、Enter，由 Claude Code 執行 /rename。</p>
      <input id="rename-input" class="live-dialog-input" type="text" autocomplete="off" aria-label="新名稱">
      <p id="rename-error" class="live-dialog-error" role="alert"></p>
      <div id="rename-manual" class="live-dialog-manual" hidden>
        <p class="live-dialog-hint">無法自動複製。請按 Ctrl+C 複製下面的指令，再按「前往分頁」。</p>
        <input id="rename-command" class="live-dialog-input" type="text" readonly aria-label="要貼上的指令">
      </div>
      <div class="live-dialog-actions">
        <button type="button" id="rename-cancel" class="live-resume">取消</button>
        <button type="submit" id="rename-submit" class="live-resume">複製並前往分頁</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/static/live.js?v=13"></script>
</body>
</html>
